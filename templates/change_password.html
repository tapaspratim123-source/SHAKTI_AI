
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | SHAKTI AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .password-container {
            max-width: 550px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .password-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .password-heading h1 {
            color: #762b91;
            margin-bottom: 10px;
        }

        .password-heading p {
            color: #777;
        }

        .password-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .password-form label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
            color: #444;
        }

        .password-form input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .password-form input:focus {
            outline: none;
            border-color: #a044c4;
            box-shadow: 0 0 5px rgba(160, 68, 196, 0.2);
        }

        .password-buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .password-buttons button,
        .password-buttons a {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .update-btn {
            background: #8735a5;
            color: white;
        }

        .update-btn:hover {
            background: #692582;
        }

        .back-btn {
            background: #f0e7f4;
            color: #762b91;
        }

        .back-btn:hover {
            background: #e5d5ed;
        }

        .password-message {
            padding: 12px;
            margin-bottom: 18px;
            background: #f5eafa;
            color: #762b91;
            border-radius: 8px;
            text-align: center;
        }

        .password-note {
            margin-top: 18px;
            padding: 12px;
            background: #f9f5fb;
            border-radius: 8px;
            color: #666;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .password-container {
                margin: 25px 15px;
                padding: 25px 20px;
            }

            .password-buttons {
                flex-direction: column;
            }
        }
    </style>

</head>

<body>

    <div class="password-container">

        <div class="password-heading">

            <div class="password-icon">🔐</div>

            <h1>Change Password</h1>

            <p>Keep your SHAKTI AI account secure.</p>

        </div>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="password-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}


        <!-- CHANGE PASSWORD FORM -->

        <form class="password-form" method="POST">

            <label for="current_password">
                Current Password
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                placeholder="Enter your current password"
                required
                autocomplete="current-password"
            >


            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter your new password"
                minlength="8"
                required
                autocomplete="new-password"
            >


            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your new password"
                minlength="8"
                required
                autocomplete="new-password"
            >


            <div class="password-buttons">

                <button type="submit" class="update-btn">
                    Update Password
                </button>

                <a href="{{ url_for('dashboard') }}" class="back-btn">
                    Back to Dashboard
                </a>

            </div>

        </form>


        <div class="password-note">
            <strong>Security tip:</strong>
            Use a strong password containing at least 8 characters.
        </div>

    </div>

</body>
</html>
