<style>
    * {

    .container {
        max-width: 750px;

    .heading {

```
<nav>
    <h2>SHAKTI AI</h2>
    <div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="heading">
        <h1>🛡️ Journey Guardian</h1>
        <p>Your journey, your safety, our priority.</p>
    </div>

    <div class="journey-card">

        <form id="journeyForm">

            <label for="destination">Enter Your Destination</label>
            <input type="text" id="destination"
                   placeholder="Example: Home, College, Office"
                   required>

            <label for="arrivalTime">Expected Arrival Time</label>
            <input type="datetime-local" id="arrivalTime" required>

            <button type="submit" class="btn">
                Start My Journey
            </button>

        </form>

        <div class="status" id="journeyStatus"></div>

        <p class="note">
            Journey Guardian is currently in development.
            This version records your journey details in this page only.
            It does not automatically monitor your location or notify
            trusted contacts.
        </p>

    </div>

</div>

<script>
    const arrivalInput = document.getElementById("arrivalTime");

    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());

    arrivalInput.min = now.toISOString().slice(0, 16);

    document.getElementById("journeyForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const destination = document.getElementById("destination").value.trim();
        const arrivalTime = document.getElementById("arrivalTime").value;
        const status = document.getElementById("journeyStatus");

        if (!destination || !arrivalTime) {
            alert("Please enter all journey details.");
            return;
        }

        if (new Date(arrivalTime) <= new Date()) {
            alert("Please select a future arrival time.");
            return;
        }

        const formattedTime = new Date(arrivalTime).toLocaleString();

        status.style.display = "block";

        status.innerHTML = `
            <strong>Journey Details Recorded!</strong><br><br>
            Destination: ${escapeHTML(destination)}<br>
            Expected Arrival: ${formattedTime}<br><br>
            Your journey details are displayed here.
        `;
    });

    function escapeHTML(value) {
        return value.replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }
</script>
